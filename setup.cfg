# setup.cfg - Configuration for Python tools
# This file configures autopep8 and other Python development tools
# while respecting the existing .flake8 configuration

[tool:autopep8]
# Maximum line length (matches .flake8 setting)
max_line_length = 100

# Aggressive level - use 2 for double aggressive
aggressive = 2

# Ignore these error codes (matches .flake8 ignore list)
# Note: autopep8 only fixes PEP8 issues (E and W codes)
ignore = E203,W503

# Exclude paths (matches .flake8 exclude list)
exclude = .venv,venv,__pycache__,.git,.pytest_cache,*.egg-info,build,dist,legacy_modules,old,deprecated,MLB Player Data,cache,results,logs,.ipynb_checkpoints,notebooks_archive

# Number of parallel jobs (use 0 for auto-detection based on CPU count)
jobs = 0

# Indentation size
indent_size = 4

# Show diff of changes
# diff = true  # Uncomment to see changes before applying

# Experimental features (use with caution)
experimental = false

[pycodestyle]
# This section is read by autopep8's underlying pycodestyle
# Maximum line length
max_line_length = 100

# Ignore these PEP8 errors/warnings (subset of .flake8 that applies to pycodestyle)
ignore = E203,W503

# Exclude these paths
exclude = .venv,venv,__pycache__,.git,.pytest_cache,*.egg-info,build,dist,legacy_modules,old,deprecated,MLB Player Data,cache,results,logs,.ipynb_checkpoints,notebooks_archive

# Show source code for errors
show_source = True

# Count errors
count = True

# Note: The aggressive flag must be passed via command line or the [tool:autopep8] section
# pycodestyle itself doesn't have an aggressive option

[metadata]
# Project metadata
name = oWAR
version = 2.0.0
description = Baseball analytics project for calculating WAR (Wins Above Replacement)
author = oWAR Development Team

[options.packages.find]
exclude =
    tests*
    docs*
    legacy_modules*
    old*
    deprecated*